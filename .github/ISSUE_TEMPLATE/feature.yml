## Problem

A clear and concise description of what problem this would solve. Ex. "I'm always frustrated when ..."

## Proposed solution

A clear and concise description of what you want to happen.

## Alternatives considered

Any alternative solutions or features you have considered.

## Use case

Who benefits and how? Is this a niche or broad use case?

## Additional context

Screenshots, mockups, links, or anything else that helps explain the request.
